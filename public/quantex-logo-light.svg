  <circle cx="72" cy="82" r="12" fill="#0a0a0a"/>
  <rect x="22" y="75" width="50" height="14" fill="#0a0a0a"/>

  <!-- QUANTEX text -->
  <text x="104" y="68" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#0a0a0a">QUANTEX</text>
