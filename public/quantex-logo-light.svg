  <circle cx="72" cy="18" r="12" fill="#0a0a0a"/>
  <rect x="22" y="11" width="50" height="14" fill="#0a0a0a"/>

  <!-- Middle signal -->
  <circle cx="22" cy="50" r="12" fill="#0a0a0a"/>
  <circle cx="72" cy="50" r="12" fill="#0a0a0a"/>
  <rect x="22" y="43" width="50" height="14" fill="#0a0a0a"/>

  <!-- Bottom signal -->
